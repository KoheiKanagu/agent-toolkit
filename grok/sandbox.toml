# Global sandbox profiles (linked to ~/.grok/sandbox.toml via install-grok-links.sh)
# Docs: Grok user guide — Permissions / Sandbox

[profiles.workspace-safe]
extends = "workspace"
# Kernel-enforced: no read/write/rename via bash, python, tools, or subagents.
# macOS: globs apply at runtime (files created later still denied).
# Linux: globs expand at launch only — prefer exact paths for airtight secrets there.
deny = [
  "**/.env",
  "**/.env.local",
  "**/.env.development",
  "**/.env.production",
  "**/.env.staging",
  "**/.env.test",
]

read_write = [
  # Flutter / Dart
  "/Users/kingu/fvm",
  "/Users/kingu/.pub-cache",
  "/Users/kingu/.dart-tool",
  # SPM / xcodebuild / シミュ（シェル経由）
  "/Users/kingu/Library/Caches/org.swift.swiftpm",
  "/Users/kingu/Library/Developer/Xcode",
  "/Users/kingu/Library/Developer/CoreSimulator",
  # git commit GPG 署名
  "/Users/kingu/.gnupg",
  # cache
  "/Users/kingu/.cache/gh"
]
